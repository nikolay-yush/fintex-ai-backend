[project]
name = "FintexAI"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.3",
    "gunicorn>=26.0.0",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.50",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=40.28.1",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "taskipy>=1.14.1",
]

[tool.uv]
package = true

[tool.taskipy.tasks]
dev = "fastapi dev"

[tool.setuptools]
packages = ["app"]
