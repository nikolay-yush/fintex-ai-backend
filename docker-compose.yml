version: '3.8'

services:
  db:
    image: postgres:15-alpine 
    container_name: fintex_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB__DB_USER}
      POSTGRES_PASSWORD: ${DB__DB_PASSWORD}
      POSTGRES_DB: ${DB__DB_NAME}
    ports:
      - "${DB__DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB__DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    container_name: fintex_ai_redis
    restart: unless-stopped
    command: 
      - redis-server
      - --requirepass
      - ${REDIS__PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pgdata: 
  redis_data: 